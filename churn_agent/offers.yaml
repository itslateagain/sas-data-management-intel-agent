# Candidate cards the agent tracks and ranks.
#
# The weekly run re-verifies every entry against the issuer's page (or, when
# the issuer site is blocked, against at least one recent secondary source
# such as Doctor of Credit / TPG / issuer press release), updates the numbers
# below in its working copy, sets last_verified + source, and adds any new
# elevated offer worth considering.
#
# last_verified: null  → seed value from the plan doc or memory; NOT confirmed.
#
# Fields
#   currency        key into profile.valuations_cpp (cash = dollars)
#   bonus_points    points/miles (use 0 for pure-cash offers)
#   bonus_cash      dollars
#   extra_value     statement credits etc. you'd actually use in year one
#   msr / msr_months  minimum spend and window
#   af_first_year   fee charged in year one (0 if waived)
#   reports_personal  business card that shows on personal reports (Cap One etc.)
#   family / tier   used for issuer once-per-lifetime / family rules
#   for             restrict to people (omit = anyone)

